aid: firsty
name: Firsty
description: Firsty is an Amsterdam-based eSIM and mobile connectivity provider founded in 2023 that
  positions internet access as a basic human right. Its consumer app delivers free, ad-supported global
  data alongside affordable Classic (pay-per-GB) and Unlimited (daily/monthly) plans, plus international
  calling, across 170+ countries with automatic connection to the best available network and no physical
  SIM required. Firsty has surpassed one million users and lists partnerships with brands including Uber,
  Grab, Mastercard, KBC and Belfius. Backed by Speedinvest, it is a consumer travel-connectivity app with
  no public developer API or programmatic surface at this time.
